<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIDEHUB – Campus Carpool Network</title>
    <meta
      name="description"
      content="Share Your Ride, Split Your Fare. Connect with fellow students travelling your way to railway stations, airports, bus hubs, and city destinations."
    />
    <meta property="og:title" content="RIDEHUB – Campus Carpool Network" />
    <meta
      property="og:description"
      content="Share Your Ride, Split Your Fare. Connect with fellow students travelling your way and split travel fares transparently."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-[#0B192C] dark:bg-[#090F1A] dark:text-slate-100 antialiased selection:bg-[#2563EB]/20 selection:text-[#0B192C] dark:selection:text-white transition-colors duration-200">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ridehub_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
